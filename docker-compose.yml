version: '3.8'

services:
  ch-ui:
    image: ghcr.io/caioricciuti/ch-ui:latest
    profiles: ["ch-ui"]
    restart: "no"
    ports:
      - "5521:3488"
    environment:
      CLICKHOUSE_URL: "http://clickhouse:8123"
      CONNECTION_NAME: "Poglytics"
      APP_URL: "${CH_UI_APP_URL:-http://localhost:5521}"
    volumes:
      - ch-ui-data:/app/data
    depends_on:
      - clickhouse
    networks:
      - twitch-chat-network

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: twitch-chat-clickhouse
    ports:
      - "18123:8123"   # HTTP interface
      - "19000:9000"   # Native TCP interface
    environment:
      - CLICKHOUSE_PASSWORD=changeme
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - ./data/clickhouse:/var/lib/clickhouse
      - ./logs/clickhouse:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - twitch-chat-network

networks:
  twitch-chat-network:
    driver: bridge

volumes:
  ch-ui-data:
